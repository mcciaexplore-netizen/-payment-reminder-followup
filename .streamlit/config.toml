[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
font = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
headingFont = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
primaryColor = "#146CAA"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
linkColor = "#146CAA"
borderColor = "#E2E8F0"
showWidgetBorder = true
showSidebarBorder = true
dataframeHeaderBackgroundColor = "#F1F5F9"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["32px", "26px", "20px", "17px", "15px", "13px"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "1.85rem"
baseRadius = "10px"
buttonRadius = "8px"
chartCategoricalColors = ["#146CAA", "#2BA84A", "#38BDF8", "#F59E0B", "#8B5CF6", "#64748B"]

[theme.sidebar]
font = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
headingFont = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
primaryColor = "#146CAA"
borderColor = "#E2E8F0"

